<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>OpenMark Settings</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 600px;
      margin: 2rem auto;
      padding: 0 1rem;
      line-height: 1.5;
    }
    h1 { font-size: 1.5rem; }
    .group {
      margin: 1.5rem 0;
      padding: 1rem;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
    }
    .group h2 {
      font-size: 1rem;
      margin: 0 0 1rem 0;
    }
    .field {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 0.75rem 0;
    }
    .field label { flex: 1; }
    select, input[type="number"] {
      width: 180px;
      padding: 4px 8px;
    }
    .saved {
      color: #2da44e;
      font-size: 0.875rem;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .saved.show { opacity: 1; }
  </style>
</head>
<body>
  <h1>OpenMark Settings</h1>
  <span class="saved" id="saved">Settings saved</span>

  <div class="group">
    <h2>Appearance</h2>
    <div class="field">
      <label>Theme</label>
      <select id="theme">
        <option value="auto">Auto (System)</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </div>
    <div class="field">
      <label>Font Family</label>
      <select id="fontFamily">
        <option value="system-ui">System Default</option>
        <option value="'Inter', sans-serif">Inter</option>
        <option value="'Georgia', serif">Georgia</option>
        <option value="'Merriweather', serif">Merriweather</option>
        <option value="'JetBrains Mono', monospace">JetBrains Mono</option>
      </select>
    </div>
    <div class="field">
      <label>Font Size (px)</label>
      <input type="number" id="fontSize" min="12" max="24" step="1">
    </div>
    <div class="field">
      <label>Line Height</label>
      <input type="number" id="lineHeight" min="1.2" max="2.0" step="0.1">
    </div>
    <div class="field">
      <label>Max Width (px)</label>
      <input type="number" id="maxWidth" min="600" max="1400" step="50">
    </div>
  </div>

  <div class="group">
    <h2>Features</h2>
    <div class="field">
      <label>Table of Contents</label>
      <input type="checkbox" id="showToc">
    </div>
    <div class="field">
      <label>Syntax Highlighting</label>
      <input type="checkbox" id="enableHighlight">
    </div>
    <div class="field">
      <label>Mermaid Diagrams</label>
      <input type="checkbox" id="enableMermaid">
    </div>
    <div class="field">
      <label>LaTeX Math (KaTeX)</label>
      <input type="checkbox" id="enableKatex">
    </div>
    <div class="field">
      <label>Auto Refresh (local files)</label>
      <input type="checkbox" id="autoRefresh">
    </div>
  </div>

  <script src="options.js" type="module"></script>
</body>
</html>
